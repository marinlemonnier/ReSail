<header>
    <a href="/" class="logo">ReSail</a>
    <div class="nav-buttons">
        <a href="{% url 'create_item' %}" class="btn-post">Post an Item</a>

        {% if user.is_authenticated %}
            <div class="dropdown">
                <button class="profile-trigger">
                    {% if user.profile_picture %}
                        <img src="{{ user.profile_picture.url }}" class="nav-avatar">
                    {% else %}
                        <div class="nav-avatar" style="display:flex;align-items:center;justify-content:center;background:#333;color:white;">
                            {{ user.username|first }}
                        </div>
                    {% endif %}
                    <span>{{ user.username }}</span>
                </button>
                <div class="dropdown-content">
                    <div class="dropdown-inner">
                        <a href="{% url 'my_profile' %}">My Profile</a>
                        <a href="{% url 'logout' %}" style="color: red;">Logout</a>
                    </div>
                </div>
            </div>
        {% else %}
            <div class="dropdown">
                <button class="profile-trigger" style="padding: 11px 24px;">Sign in ▼</button>
                <div class="dropdown-content">
                    <div class="dropdown-inner">
                        <a href="{% url 'login' %}">Login</a>
                        <a href="{% url 'signup' %}">Create account</a>
                    </div>
                </div>
            </div>
        {% endif %}
    </div>
</header>

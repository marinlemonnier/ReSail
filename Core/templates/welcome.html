{% extends 'base.html' %}
{% load static %}

{% block extra_css %}
    <link rel="stylesheet" href="{% static 'Core/css/welcome.css' %}">
{% endblock %}

{% block content %}
    <div class="hero-container">
        <div class="hero-card">
            <img src="/media/image_1ff759.png" alt="ReSail Banner">
        </div>
    </div>

    <div class="container">
        <h2 class="section-title">Latest Items</h2>
        <div class="ads-grid">
            {% for item in items %}
                <div class="ad-card">
                    <div class="ad-img-placeholder"></div>
                    <div class="ad-body">
                        <h3><a href="{% url 'item_detail' item.id %}">{{ item.title }}</a></h3>
                        <p class="ad-price">{{ item.price }} {{ item.currency }}</p>
                        <p class="ad-city">📍 {{ item.city }}</p>
                    </div>
                </div>
            {% empty %}
                <p>No items available for sale yet.</p>
            {% endfor %}
        </div>
    </div>
{% endblock %}
